# Copy to ~/.config/hyprdie/config.toml

[ui]
title = "Ending session..."
# Supports PNG, JPEG, WebP, etc. Relative paths are resolved from the working directory.
# background = "~/Pictures/shutdown.png"

[ui.colors]
# Colors are #rrggbb hex strings.
title = "#ffffff"
heading = "#ffffff"
app = "#acb5c7"
hint = "#808080"
# Solid background used when no background image is set.
background = "#1b1818"

[behavior]
poll_interval_ms = 150
retry_interval_ms = 5000
# SIGTERM is sent first; if an app is still alive after this long, escalate to SIGKILL.
sigkill_timeout_ms = 10000
dry_run = false
no_exit = false

[commands]
# post = "systemctl poweroff"

# CLI overrides are also available:
# hyprdie --dry-run
# hyprdie --post-cmd 'systemctl reboot'
# hyprdie --config /path/to/config.toml
