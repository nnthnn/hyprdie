<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="hyprdie">
  <title>hyprdie - app icon</title>
  <!--
    App icon: the tombstone render, rebuilt flat.

    It is not a trace of the render. The render is a shaded illustration - white,
    a grey stone face, a black keyline - and a single-tone trace collapses that to
    a silhouette, which is why tracing it was rejected. Here the shapes are
    reconstructed from masks instead, so the three tones survive:

      * the outer white border sits 37px (of 1024) inside the silhouette
      * the black keyline is the 17px band after it
      * the grey stone face is everything inside that

    The inset border is a distance transform of the silhouette, not a drawn path,
    so it stays uniform around the plinth. The skull is the render's own white ink:
    its solid body, with the eye sockets, nose and the gaps between the teeth
    traced back in dark.

    Used at 64px. Above that the icon is the shaded render itself
    (assets/hero.png); below it the skull stops resolving and icon-simple.svg takes
    over - the same mark with the skull left off.

    Source render : A-tomb, seed 2
    Content bbox  : 126,35 - 898,980 in the 1024 canvas
    Fit           : 78% of the 256 viewBox (scale 0.2113), centred
  -->
